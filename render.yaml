services:
  - type: web
    name: liga-mx-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run db:push && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: liga-mx-db
          property: connectionString
      - key: SINCRONIZACION_ACTIVA
        value: "true"
      - key: NODE_VERSION
        value: "22"

  - type: web
    name: liga-mx-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://liga-mx-backend.onrender.com/api

databases:
  - name: liga-mx-db
    databaseName: liga_mx
    user: liga_mx
